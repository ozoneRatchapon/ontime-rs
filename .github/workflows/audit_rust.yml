name: Rust dependency audit

# Known vulnerabilities, licences and sources of every Rust dependency, by
# `cargo deny` against `deny.toml` (plan 019, item 5). Weekly as well as on
# push, because a new advisory arrives without any change here.

on:
  pull_request:
    branches: '*'
  push:
    branches: [master, feat/rust-cloud-backend, 'feature/**', 'hotfix/**']
    paths: ['**/Cargo.toml', '**/Cargo.lock', 'deny.toml', '.github/workflows/audit_rust.yml']
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - packages/ontime-core/Cargo.toml
          - packages/ontime-wasm/Cargo.toml
          - apps/server-rs/Cargo.toml
          - apps/server-native/Cargo.toml

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny
        run: cargo deny --manifest-path ${{ matrix.manifest }} --config deny.toml check
