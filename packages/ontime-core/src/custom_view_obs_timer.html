<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timer</title>
    <!--
      The running event's timer, for OBS on top of a camera (plan 022). Add it
      as a Browser Source, 1920x1080; the page is see-through apart from the
      timer. Everything is set in the address:

        pos=br          corner: tl, tr, bl, br (default), or c for the centre
        size=12         height of the numbers, in % of the screen (default 12)
        title=1         show the event title above the numbers (default 1)
        idle=hide       when nothing plays: hide (default) or show
        bg=000000b3     box colour (default dark, see-through), "none" for no box
        color=ffffff    numbers colour
        warning=ffa528  colour once the event's warning time is reached
        danger=ff4d4f   colour once the event's danger time is reached, and over time
        font=Prompt     a Google Font by name

      Over time it counts up with a minus sign, in the danger colour. The
      numbers are counted here from the room's last message, so they run
      smoothly between messages and stop when the room pauses.
    -->
    <style>
      :root {
        --box: rgba(0, 0, 0, 0.7);
        --color: #ffffff;
        --warning: #ffa528;
        --danger: #ff4d4f;
        --size: 12vh;
        --font: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
      body { font-family: var(--font); color: var(--color); position: relative; }
      #box {
        position: absolute;
        padding: calc(var(--size) * 0.18) calc(var(--size) * 0.35);
        border-radius: calc(var(--size) * 0.18);
        background: var(--box);
        text-align: center;
        transition: opacity 0.3s;
      }
      #box.tl { top: 4vh; left: 3vw; }
      #box.tr { top: 4vh; right: 3vw; }
      #box.bl { bottom: 4vh; left: 3vw; }
      #box.br { bottom: 4vh; right: 3vw; }
      #box.c { top: 50%; left: 50%; transform: translate(-50%, -50%); }
      #box.hidden { opacity: 0; }
      #title {
        font-size: calc(var(--size) * 0.28);
        opacity: 0.85;
        max-width: 40vw;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #title[hidden] { display: none; }
      #time {
        font-size: var(--size);
        font-weight: 800;
        line-height: 1.05;
        font-variant-numeric: tabular-nums;
      }
      #time.warning { color: var(--warning); }
      #time.danger { color: var(--danger); }
      #box.paused #time { opacity: 0.6; }
    </style>
  </head>
  <body>
    <div id="box" class="br hidden">
      <div id="title"></div>
      <div id="time">--:--</div>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const colour = (value) => (/^[0-9a-f]{3,8}$/i.test(value) ? `#${value}` : value);
      const root = document.documentElement.style;
      for (const [key, variable] of [
        ['color', '--color'],
        ['warning', '--warning'],
        ['danger', '--danger'],
      ]) {
        if (params.get(key)) root.setProperty(variable, colour(params.get(key)));
      }
      if (params.get('bg')) root.setProperty('--box', params.get('bg') === 'none' ? 'transparent' : colour(params.get('bg')));
      const size = Number(params.get('size'));
      if (size > 0 && size <= 100) root.setProperty('--size', `${size}vh`);
      const font = params.get('font');
      if (font) {
        const style = document.createElement('style');
        style.textContent = `@import url('https://fonts.googleapis.com/css2?family=${encodeURIComponent(font)}:wght@400;800&display=swap');`;
        document.head.appendChild(style);
        root.setProperty('--font', `'${font.replace(/'/g, '')}', system-ui, sans-serif`);
      }
      const box = document.getElementById('box');
      const pos = params.get('pos');
      if (['tl', 'tr', 'bl', 'br', 'c'].includes(pos)) box.className = `${pos} hidden`;
      const showTitle = params.get('title') !== '0';
      const showIdle = params.get('idle') === 'show';
      const time = document.getElementById('time');
      const title = document.getElementById('title');

      // what the room said last, and when we heard it
      let timer = null;
      let event = null;
      let heardAt = 0;

      function format(ms) {
        const over = ms < 0;
        const total = Math.floor(Math.abs(ms) / 1000) + (over ? 0 : Math.abs(ms) % 1000 > 0 ? 1 : 0);
        const h = Math.floor(total / 3600);
        const m = Math.floor((total % 3600) / 60);
        const s = total % 60;
        const two = (n) => String(n).padStart(2, '0');
        const body = h > 0 ? `${h}:${two(m)}:${two(s)}` : `${two(m)}:${two(s)}`;
        return over ? `-${body}` : body;
      }

      function render() {
        const playing = timer && timer.playback === 'play' && typeof timer.current === 'number';
        const paused = timer && timer.playback === 'pause' && typeof timer.current === 'number';
        const active = playing || paused;
        box.classList.toggle('hidden', !active && !showIdle);
        box.classList.toggle('paused', Boolean(paused));
        if (active) {
          const left = playing ? timer.current - (performance.now() - heardAt) : timer.current;
          time.textContent = format(left);
          const warning = event?.timeWarning ?? 120000;
          const danger = event?.timeDanger ?? 60000;
          time.classList.toggle('danger', left <= danger);
          time.classList.toggle('warning', left > danger && left <= warning);
        } else {
          time.textContent = '--:--';
          time.classList.remove('warning', 'danger');
        }
        title.hidden = !showTitle || !event?.title;
        title.textContent = event?.title ?? '';
        requestAnimationFrame(render);
      }
      requestAnimationFrame(render);

      let retry = 1000;
      function connect() {
        const socket = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
        socket.onopen = () => (retry = 1000);
        socket.onmessage = (message) => {
          const { tag, payload } = JSON.parse(message.data);
          if (tag !== 'runtime-data') return;
          if ('timer' in payload) {
            timer = payload.timer;
            heardAt = performance.now();
          }
          if ('eventNow' in payload) event = payload.eventNow;
        };
        socket.onclose = () => {
          setTimeout(connect, retry);
          retry = Math.min(retry * 2, 30000);
        };
      }
      connect();
    </script>
  </body>
</html>
