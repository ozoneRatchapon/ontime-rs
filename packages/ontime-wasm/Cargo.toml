[package]
name = "ontime-wasm"
version = "0.1.0"
edition = "2021"
authors = ["Ontime Team"]
license = "GPL-3.0-or-later"
publish = false
description = "Browser bindings for the ontime timer engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.126"   # must match the wasm-bindgen CLI exactly
serde_json = "1.0"
# the browser cannot upload spreadsheets to itself; keep the bundle lean
ontime-core = { path = "../ontime-core", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
