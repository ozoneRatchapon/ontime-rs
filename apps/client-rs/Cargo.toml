[package]
name = "ontime-client-rs"
version = "0.1.0"
edition = "2021"
authors = ["Ontime Team"]

[dependencies]
dioxus = { version = "0.6", features = ["web"] }
ontime-core = { path = "../../packages/ontime-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gloo-net = "0.6"
wasm-bindgen = "=0.2.105"
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "Window", "Document"] }
wasm-bindgen-futures = "0.4"
