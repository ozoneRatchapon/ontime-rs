[package]
name = "ontime-server-rs"
version = "0.1.0"
edition = "2021"
authors = ["Ontime Team"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = "0.4.0"
worker-macros = "0.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.15", features = ["v7", "serde", "js"] }
wasm-bindgen = "=0.2.105"
console_error_panic_hook = "0.1"
# a Worker cannot accept file uploads, so the spreadsheet parser (calamine + zip +
# encoding_rs) would be dead weight in the wasm bundle
ontime-core = { path = "../../packages/ontime-core", default-features = false }

[profile.release]
opt-level = "s"   # optimise for size; this workload is not CPU-bound
lto = true
codegen-units = 1
panic = "abort"
strip = true
