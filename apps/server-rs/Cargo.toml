[package]
name = "ontime-server-rs"
version = "0.1.0"
edition = "2021"
authors = ["Ontime Team"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = "0.4.0"
worker-macros = "0.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.15", features = ["v7", "serde", "js"] }
wasm-bindgen = "=0.2.105"
blake3 = "1.5"
chrono = { version = "0.4", features = ["serde"] }
ontime-core = { path = "../../packages/ontime-core" }
